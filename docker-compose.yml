services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mahdi_barbershop
      POSTGRES_USER: mahdi
      POSTGRES_PASSWORD: change-me
    ports:
      - "${PG_HOST_PORT:-5432}:5432"
    volumes:
      - mahdi_pgdata:/var/lib/postgresql/data
  api:
    build: ./server
    environment:
      PORT: 3000
      DATABASE_URL: postgres://mahdi:change-me@db:5432/mahdi_barbershop
      JWT_SECRET: replace-with-a-long-random-secret
      CORS_ORIGIN: '*'
    depends_on:
      - db
    ports:
      - "3000:3000"
volumes:
  mahdi_pgdata:
